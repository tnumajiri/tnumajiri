<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>SUPER MARIO CLONE FC</title>
<style>
  html,body{
    margin:0; padding:0; background:#101010; color:#ddd;
    font-family:'Courier New',monospace;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; min-height:100dvh;
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }
  h1{ font-size:16px; letter-spacing:2px; margin:14px 0 8px; color:#fff; }
  #wrap{
    position:relative;
    width:min(768px, 100vw);
    aspect-ratio:256/240;
  }
  canvas{
    width:100%; height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#5c94fc;
    display:block;
  }
  #help{ font-size:12px; margin:10px; line-height:1.7; text-align:center; }
  kbd{ background:#333; border:1px solid #666; border-radius:3px; padding:0 5px; }

  /* ---- touch controls (shown on tablets / phones) ---- */
  #touch{
    display:none;
    width:100%; max-width:820px;
    justify-content:space-between; align-items:center;
    padding:12px 16px calc(18px + env(safe-area-inset-bottom));
    box-sizing:border-box; gap:8px;
  }
  #pad{ display:flex; gap:8px; }
  .tbtn{
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none;
    touch-action:none;
    color:#eee; font-family:inherit; font-weight:bold;
  }
  .half{
    width:78px; height:78px; font-size:30px;
    background:rgba(40,40,40,.85); border:2px solid #555; border-radius:14px;
  }
  #acts{ display:flex; align-items:center; gap:14px; }
  #acts .tbtn{
    width:80px; height:80px; border-radius:50%; font-size:24px;
    background:rgba(170,30,30,.85); border:2px solid #d66; color:#fff;
  }
  #sysbtns{ display:flex; flex-direction:column; gap:10px; }
  #sysbtns .tbtn{
    background:#333; border:1px solid #777; color:#ccc;
    padding:8px 12px; border-radius:8px; font-size:11px;
  }
  @media (pointer:coarse), (hover:none){
    body{ overflow:hidden; height:100dvh; justify-content:flex-start; }
    h1{ font-size:13px; margin:6px 0 4px; }
    #help{ display:none; }
    #touch{ display:flex; }
    #wrap{ width:min(100vw, calc((100dvh - 175px) * 256 / 240)); }
  }
  /* narrow phones: shrink the controls so everything fits */
  @media (max-width:540px){
    #touch{ padding:8px 8px calc(12px + env(safe-area-inset-bottom)); gap:4px; }
    .half{ width:58px; height:58px; font-size:22px; border-radius:10px; }
    #pad{ gap:5px; }
    #acts{ gap:8px; }
    #acts .tbtn{ width:62px; height:62px; font-size:15px; }
    #sysbtns{ gap:6px; }
    #sysbtns .tbtn{ padding:5px 7px; font-size:9px; }
    #wrap{ width:min(100vw, calc((100dvh - 130px) * 256 / 240)); }
    h1{ display:none; }
  }
</style>
</head>
<body>
<h1>SUPER MARIO CLONE FC</h1>
<div id="wrap"><canvas id="game" width="256" height="240"></canvas></div>
<div id="touch">
  <div id="pad">
    <div class="tbtn half" id="btnL">&#9664;</div>
    <div class="tbtn half" id="btnR">&#9654;</div>
  </div>
  <div id="sysbtns">
    <div class="tbtn" id="btnStart">START</div>
    <div class="tbtn" id="btnMute">SOUND</div>
  </div>
  <div id="acts">
    <div class="tbtn" id="btnB">B<br>DASH</div>
    <div class="tbtn" id="btnA">A<br>JUMP</div>
  </div>
</div>
<div id="help">
  <kbd>←</kbd><kbd>→</kbd> 移動&nbsp;
  <kbd>Z</kbd>/<kbd>Space</kbd> ジャンプ&nbsp;
  <kbd>X</kbd>/<kbd>Shift</kbd> ダッシュ・ファイア&nbsp;
  <kbd>Enter</kbd> スタート&nbsp;
  <kbd>M</kbd> サウンドON/OFF
</div>
<script src="game.js"></script>
</body>
</html>
