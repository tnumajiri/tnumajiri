<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>農薬検索アプリ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>農薬検索</h1>
    <p class="subtitle">農林水産省・FAMIC 公開データに基づく農薬検索</p>
  </header>

  <main>
    <section class="search-panel">
      <div class="field">
        <label for="q-name">農薬名 / 有効成分</label>
        <input type="search" id="q-name" placeholder="例: スミチオン、MEP" autocomplete="off" />
      </div>

      <div class="field">
        <label for="q-crop">対象作物</label>
        <select id="q-crop">
          <option value="">すべて</option>
        </select>
      </div>

      <div class="field">
        <label for="q-pest">病害虫</label>
        <select id="q-pest">
          <option value="">すべて</option>
        </select>
      </div>

      <div class="field actions">
        <button id="btn-reset" type="button">リセット</button>
      </div>
    </section>

    <section class="results">
      <div class="results-header">
        <span id="result-count">0 件</span>
        <span class="data-source">
          データ:
          <a href="https://www.acis.famic.go.jp/" target="_blank" rel="noopener">FAMIC 農薬登録情報提供システム</a>
          をベースにしたサンプル
        </span>
      </div>
      <ul id="result-list" class="result-list"></ul>
      <p id="empty-state" class="empty-state" hidden>該当する農薬が見つかりませんでした。</p>
    </section>
  </main>

  <footer>
    <p>※ 本アプリの内容は参考情報です。実際の使用前に必ず最新の登録情報・ラベルを確認してください。</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
