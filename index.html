<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPER MARIO CLONE FC</title>
<style>
  html,body{
    margin:0; padding:0; background:#101010; color:#ddd;
    font-family:'Courier New',monospace;
    display:flex; flex-direction:column; align-items:center; min-height:100vh;
  }
  h1{ font-size:16px; letter-spacing:2px; margin:14px 0 8px; color:#fff; }
  #wrap{
    position:relative;
    width:768px; height:720px; max-width:100vw; max-height:93.75vw;
  }
  canvas{
    width:100%; height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#5c94fc;
    display:block;
  }
  #help{ font-size:12px; margin:10px; line-height:1.7; text-align:center; }
  kbd{ background:#333; border:1px solid #666; border-radius:3px; padding:0 5px; }
</style>
</head>
<body>
<h1>SUPER MARIO CLONE FC</h1>
<div id="wrap"><canvas id="game" width="256" height="240"></canvas></div>
<div id="help">
  <kbd>←</kbd><kbd>→</kbd> 移動&nbsp;
  <kbd>Z</kbd>/<kbd>Space</kbd> ジャンプ&nbsp;
  <kbd>X</kbd>/<kbd>Shift</kbd> ダッシュ・ファイア&nbsp;
  <kbd>Enter</kbd> スタート&nbsp;
  <kbd>M</kbd> サウンドON/OFF
</div>
<script src="game.js"></script>
</body>
</html>
